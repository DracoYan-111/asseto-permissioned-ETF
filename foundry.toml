[profile.ci.fuzz]
runs = 10_000

[profile.default]
optimizer = true
optimizer_runs = 999_999

src = "src"
out = "out"
libs = ["lib"]

ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

evm_version = "cancun"
auto_detect_solc = true

viaIR= true

[lint]
# Disable forge-lint notes during `forge build`
lint_on_build = false

fs_permissions = [{ access = "read", path = "out" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
  "@solady/contracts/=lib/solady/src/"
]


[rpc_endpoints]
bsc-testnet = "${BSC_TESTNET_RPC_URL}"
bsc-mainnet = "${BSC_MAINNET_RPC_URL}"

eth-testnet = "${ETH_SEPOLIA_RPC_URL}"
eth-mainnet = "${ETH_MAINNET_RPC_URL}"

[etherscan]
bsc-testnet = {key="${ETHERSCAN_KEY}",url="${BSC_TESTNET_API_URL}"}
bsc = {key="${ETHERSCAN_KEY}",url="${BSC_MAINNET_API_URL}"}

sepolia = {key="${ETHERSCAN_KEY}",url="${ETH_SEPOLIA_API_URL}"}
eth = {key="${ETHERSCAN_KEY}",url="${ETH_MAINNET_API_URL}"}